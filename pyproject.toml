[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "perseus-agent-core"
version = "0.2.0"
description = "Perseus Vault memory boundary plus isolated historical Elastic support, decision log, knowledge graph, and project context."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "tcconnally" }]
requires-python = ">=3.10"
# Zero hard dependencies: the Elasticsearch client is imported lazily only by
# the isolated historical Elastic adapter.
dependencies = []

[project.optional-dependencies]
elastic = ["elasticsearch>=8.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/Perseus-Computing-LLC/perseus-agent-core"

[tool.setuptools]
packages = [
    "perseus_agent_core",
    "perseus_agent_core.memory",
    "perseus_agent_core.tools",
]
